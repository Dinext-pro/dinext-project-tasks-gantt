name: Dinext acceptance

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-path-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Cypress acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext-common
          ref: c080095bd61ea5cc89b1bb9ef12e809ea00e68ce
          path: ci-support
          persist-credentials: false
          sparse-checkout: .github/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install isolated acceptance tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client libmariadb-dev libmariadb-dev-compat \
            libxml2-dev libxslt1-dev libffi-dev libjpeg-dev zlib1g-dev redis-tools \
            xvfb libgtk-3-0 libnss3 libnspr4 libasound2t64 libgbm1
          python -m pip install frappe-bench==5.31.0
          npm install --global yarn@1.22.22
          npm install --prefix "$RUNNER_TEMP/cypress-tools" cypress@13.17.0 --no-audit --no-fund
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/frappe
          ln -s "$RUNNER_TEMP/dinext-test-bench" /home/frappe/frappe-bench
      - name: Build disposable bench and run server tests
        env:
          CI: 'true'
          DINEXT_DEPLOY_ENABLED: 'false'
          DINEXT_NOTIFICATIONS_ENABLED: 'false'
          DINEXT_DOCS_AGENT_ENABLED: '0'
          DINEXT_WIKI_PUBLISH_ENABLED: '0'
        run: python ci-support/.github/ci/bench_tests.py "$GITHUB_WORKSPACE"
      - name: Run critical-path browser acceptance
        env:
          CI: 'true'
          DINEXT_DEPLOY_ENABLED: 'false'
          DINEXT_NOTIFICATIONS_ENABLED: 'false'
          DINEXT_DOCS_AGENT_ENABLED: '0'
          DINEXT_WIKI_PUBLISH_ENABLED: '0'
        run: python .github/ci/critical_path_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: critical-path-acceptance
          path: |
            ${{ runner.temp }}/critical-path-acceptance/
            ${{ runner.temp }}/*-unit.xml
          if-no-files-found: error
          retention-days: 14
